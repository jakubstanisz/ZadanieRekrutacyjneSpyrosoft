spring.application.name=backend

# Supabase PostgreSQL (Session Pooler on port 5432 for Hibernate prepared statements)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=ev_charging
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Caffeine Cache for Carbon Intensity API responses
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=15m

# Carbon Intensity API client settings
app.carbon-intensity.base-url=https://api.carbonintensity.org.uk
app.carbon-intensity.connect-timeout=5s
app.carbon-intensity.read-timeout=5s

# CORS allowed origins for the standalone React frontend
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Max connection pool size for Supabase (limit 15)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
