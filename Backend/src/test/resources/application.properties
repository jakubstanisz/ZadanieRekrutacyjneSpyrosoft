# H2 in PostgreSQL compatibility mode for fast, self-contained local/CI tests
spring.datasource.url=jdbc:h2:mem:ev_charging_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS ev_charging
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=ev_charging
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.test.database.replace=none
